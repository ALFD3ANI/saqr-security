server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;

    # React SPA — كل المسارات ترجع index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE endpoints — تعطيل الـ buffering لضمان التدفق الفوري
    location ~ ^/api/v1/(ai|compliance)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # WebSocket — لمتابعة تقدم الفحوصات
    location ~ ^/api/v1/scans/[0-9]+/progress {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # باقي مسارات API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Cache للـ assets الثابتة
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # إخفاء رقم إصدار nginx
    server_tokens off;
}
